<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth"><div class="auth-card"><div class="brand">RA</div><p class="eyebrow">CAREER GROWTH ASSISTANT</p><h1>Welcome back</h1><p class="muted">Sign in to your career workspace.</p><p class="success" th:if="${param.registered}">Account created. Please sign in.</p><p class="error" th:if="${param.error}">Invalid email or password.</p><form method="post" th:action="@{/login}"><label>Email</label><input type="email" name="username" required><label>Password</label><input type="password" name="password" required><button class="btn full">Sign in</button></form><p class="center">New here? <a href="/register">Create account</a></p></div></body></html>

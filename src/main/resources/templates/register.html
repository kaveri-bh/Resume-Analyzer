<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth"><div class="auth-card"><div class="brand">RA</div><p class="eyebrow">GET STARTED</p><h1>Create account</h1><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/register}"><label>Full name</label><input name="fullName" required><label>Email</label><input type="email" name="email" required><label>Password (minimum 8 characters)</label><input type="password" name="password" minlength="8" required><button class="btn full">Create account</button></form><p class="center">Already registered? <a href="/login">Sign in</a></p></div></body></html>
